# Academic-Reading v2 — the text catalogue.
#
# One section per text. The section name is the text's id and shows up nowhere
# the reader can see it, so keep it short. Every field is optional:
#
#   title      what the reader sees. Defaults to the filename.
#   author     who wrote it, and the date if you know it — "Jules Ferry, 1885".
#              Passed to the model as provenance; leave it out rather than guess,
#              because the model is forbidden from inventing one and will say
#              nothing instead. There is no separate year field: put the date
#              here.
#   language   English name or ISO code. Detected from the text if absent.
#   file       the file in sources/. Defaults to <section>.txt.
#   level      introductory | intermediate | advanced, or a CEFR band.
#              Calibrates how much the model explains. Defaults to
#              default_level in config.yaml.
#   source     where the text came from. Shown as provenance.
#   notes      a line on what this passage is, or what was cut.
#
# A file in sources/ with no section here is still offered, titled from its
# filename with its language guessed. FILE-NAME, file_name and file are all
# accepted, as are lang for language, url for source, and by for author.

[marx]
title = Manifest der Kommunistischen Partei — I. Bourgeois und Proletarier
author = Karl Marx & Friedrich Engels, 1848
language = German
file = marx-manifest.txt
level = advanced
source = https://www.marxists.org/deutsch/archiv/marx-engels/1848/manifest/1-bourprol.htm
notes = Opening of section I through the bourgeoisie's remaking of world production. Orthography modernised.


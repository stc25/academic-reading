# Standalone stack for the two Academic Reading apps.
# Layout expected (this file sits in /var/www/academic-reading):
#   ./academic-reading/academic_reading_django/      v1 (+ .env)
#   ./academic-reading-eng/academic_reading_django/  v2 (+ .env)
#
#   docker compose up -d --build                    apps + databases (bound to 127.0.0.1 only)
#   docker compose --profile caddy up -d --build    ...plus the bundled Caddy reverse proxy (80/443)
#
# Service names for the databases match the hostnames already in the .env DATABASE_URL values.

services:
  academic-reading-eng:
    build:
      context: ./academic-reading-eng/academic_reading_django
    restart: unless-stopped
    env_file:
      - ./academic-reading-eng/academic_reading_django/.env
    ports:
      - "127.0.0.1:${ARE_PORT:-8002}:8000"
    depends_on:
      mariadb_academic_reading:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  mariadb_academic_reading:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - ./academic-reading-eng/academic_reading_django/.env
    environment:
      MARIADB_DATABASE: academic_reading_eng
      MARIADB_USER: academic_reading
    volumes:
      - mariadb_academic_reading_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uacademic_reading --password=\"$$MARIADB_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  academic-reading:
    build:
      context: ./academic-reading/academic_reading_django
    restart: unless-stopped
    env_file:
      - ./academic-reading/academic_reading_django/.env
    ports:
      - "127.0.0.1:${ARV1_PORT:-8001}:8000"
    depends_on:
      mariadb_academic_reading_v1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  mariadb_academic_reading_v1:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - ./academic-reading/academic_reading_django/.env
    environment:
      MARIADB_DATABASE: academic_reading_v1
      MARIADB_USER: academic_reading_v1
    volumes:
      - mariadb_academic_reading_v1_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uacademic_reading_v1 --password=\"$$MARIADB_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Optional: only started with `--profile caddy`. Skip it if lcapps already has a
  # reverse proxy on 80/443 (see README.md, "Reverse proxy").
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      academic-reading:
        condition: service_healthy
      academic-reading-eng:
        condition: service_healthy

volumes:
  mariadb_academic_reading_data:
  mariadb_academic_reading_v1_data:
  caddy_data:
  caddy_config:
